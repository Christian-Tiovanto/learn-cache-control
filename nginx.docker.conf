# nginx.docker.conf - the same real reverse proxy + cache, for the official nginx Docker image.
# docker-compose.yml mounts this file as /etc/nginx/nginx.conf (read-only).
#
# Differences from nginx.conf:
#   * no "daemon off": the official image already starts nginx in the foreground
#   * absolute paths inside the container (the image already owns /var/cache/nginx)
#   * the origin is server.js running on YOUR machine (npm run origin), reached through
#     host.docker.internal (inside a container, "localhost" would be the container itself)

user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    # One line per request: what happened, and what the cache did.
    log_format demo '$request  ->  $status   cache=$upstream_cache_status';
    access_log /dev/stdout demo;
    keepalive_timeout 0;
    # WHERE the cache lives (inside the container) and how big it may get.
    proxy_cache_path /var/cache/nginx/demo levels=1:2 keys_zone=demo:1m max_size=10m inactive=1h use_temp_path=off;

    server {
        listen 4000;

        location /api/ {
            proxy_pass http://host.docker.internal:3000;   # server.js on your machine (change the port here if needed)

            proxy_cache demo;                        # turn caching on for this location
            proxy_cache_revalidate on;               # when stale, ask the origin with If-None-Match (-> 304)
            proxy_cache_background_update on;        # refresh stale entries in the background
            proxy_cache_lock on;                     # many identical requests -> ONE goes to the origin

            # --- Tested behavior (nginx 1.24, see README Part 3) -----------------------------
            # * Response Cache-Control is honored: max-age is the lifetime; private / no-store /
            #   max-age=0 responses are NOT stored (so /api/inventory is never cached here).
            # * stale-while-revalidate works because background_update is on.
            # * stale-if-error works when the origin is UNREACHABLE (down, refused, timeout).
            #   It does NOT apply when the origin answers with an HTTP 5xx (e.g. 503). For that,
            #   uncomment the next line, but note it ignores the stale-if-error time window:
            # proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            # * Client request directives (no-cache, max-age=0) are ignored by default.

            # --- CORS: lets the test page served from http://localhost:3000 read answers from this proxy.
            # A different PORT is a different origin, so without these headers the browser blocks the page from
            # reading the response. "*" is fine for a local demo; in production list your site's origin instead.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "X-Cache-Status, X-Proxy-Request-Id, X-Proxy-Saw-Request-Cache-Control" always;

            # The browser first asks "may I send a Cache-Control header?" with an OPTIONS "preflight" (needed whenever
            # the page sets its own request headers). Answer it here; it never needs to reach server.js.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Cache-Control, Pragma, If-None-Match, If-Modified-Since" always;
                add_header Access-Control-Max-Age 600 always;
                return 204;
            }

            # Shows HIT / MISS / EXPIRED / STALE in the response (an uncached response shows MISS).
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Proxy-Request-Id $request_id always;                              # unique per request that reaches nginx
            add_header X-Proxy-Saw-Request-Cache-Control $http_cache_control always;       # the request Cache-Control nginx received
        }
    }
}